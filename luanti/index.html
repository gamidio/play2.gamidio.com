<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Luanti – Gamidio</title>
<!-- Gamidio bar (owner 2026-11-03): a game that needs its own page keeps a thin Gamidio bar on top. The game runs in a
     frame from the same folder, so its cross-origin isolation (WebAssembly threads), saves and touch controls stay. -->
<script src="coi-serviceworker.js"></script>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font:500 14px system-ui,-apple-system,sans-serif}
#gb{position:absolute;left:0;right:0;top:0;height:32px;display:flex;align-items:center;gap:16px;padding:0 12px;padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right));background:#17121f;color:#fff;box-sizing:border-box;z-index:5}
#gb a{color:#b9b0cc;text-decoration:none;display:flex;align-items:center;gap:6px;white-space:nowrap;min-width:0}
#gb a:hover,#gb a:focus-visible{color:#fff}
#gb .logo{color:#fff}
#gb .g{flex:none;width:18px;height:18px;border-radius:5px;background:#7c5cff;display:inline-flex;align-items:center;justify-content:center;font-size:11px;color:#fff}
#gb .name{overflow:hidden;text-overflow:ellipsis}
#gb .sp{flex:1}
#gb button{font:inherit;color:#fff;background:#7c5cff;border:0;border-radius:6px;padding:4px 10px;display:flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap}
#gb button:hover{background:#6a4ae6}
#gb svg{flex:none}
#stage{position:absolute;left:0;right:0;top:32px;bottom:0;overflow:hidden}
#game{border:0;display:block;width:100%;height:100%;transform-origin:0 0}
#pill{display:none;position:absolute;z-index:6;top:max(8px,env(safe-area-inset-top));width:30px;height:30px;border-radius:50%;background:rgba(23,18,31,.72);border:1px solid rgba(255,255,255,.55);color:#fff;align-items:center;justify-content:center;font-size:13px;cursor:pointer;padding:0}
#pill.left{left:max(8px,env(safe-area-inset-left))}
#pill.right{right:max(8px,env(safe-area-inset-right))}
#pill.center{left:50%;transform:translateX(-50%)}
body.full #gb{display:none}
body.full #stage{top:0}
body.full #pill{display:flex}
body.full.peek #gb{display:flex}
@media (max-width:700px),(max-height:500px){
  #gb{height:26px;gap:12px;font-size:13px}
  #stage{top:26px}
  #gb .g{width:16px;height:16px;font-size:10px}
  #gb .more{display:none}
  #gb button{padding:2px 8px}
}
@media (max-width:420px){#gb .brand,#gb .fsl{display:none}}
</style>
</head>
<body>
<nav id="gb" aria-label="Gamidio">
  <a class="logo" href="https://gamidio.com/" title="Gamidio home"><span class="g" aria-hidden="true">G</span><span class="brand">Gamidio</span></a>
  <a href="https://gamidio.com/game/luanti/" title="Back to the game page"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="name">Luanti</span></a>
  <span class="sp"></span>
  <a class="more" href="https://gamidio.com/games/">More games</a>
  <button type="button" id="fs"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="fsl">Fullscreen</span></button>
</nav>
<div id="stage"><iframe id="game" title="Luanti" allow="cross-origin-isolated; autoplay; fullscreen; gamepad; clipboard-write; screen-wake-lock; accelerometer; gyroscope"></iframe></div>
<button type="button" id="pill" class="left" aria-label="Show the Gamidio bar">G</button>
<script>
(function () {
  var DESIGN = 0;  // games that need a desktop-sized window get it on small screens, scaled down
  var game = document.getElementById('game'), stage = document.getElementById('stage');
  var fs = document.getElementById('fs'), pill = document.getElementById('pill'), label = fs.querySelector('.fsl');
  game.src = 'game.html' + location.search + location.hash;
  game.addEventListener('load', function () { try { game.contentWindow.focus(); } catch (e) {} });
  stage.addEventListener('pointerdown', function () { try { game.contentWindow.focus(); } catch (e) {} });

  var touch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  function fit() {
    var w = stage.clientWidth, h = stage.clientHeight;
    if (DESIGN && touch && Math.min(screen.width, screen.height) < 640 && w < DESIGN) {
      var s = w / DESIGN;
      game.style.width = DESIGN + 'px';
      game.style.height = Math.round(h / s) + 'px';
      game.style.transform = 'scale(' + s + ')';
    } else {
      game.style.width = game.style.height = game.style.transform = '';
    }
  }
  fit();
  addEventListener('resize', fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe(stage);

  var root = document.documentElement;
  var request = root.requestFullscreen || root.webkitRequestFullscreen;
  var exit = document.exitFullscreen || document.webkitExitFullscreen;
  function isFull() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
  if (!request) fs.hidden = true;  // iPhone Safari has no fullscreen for pages
  fs.addEventListener('click', function () {
    if (isFull()) { exit.call(document); return; }
    var done = request.call(root, {navigationUI: 'hide'});
    var lock = function () { if (touch && screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(function () {}); };
    if (done && done.then) done.then(lock, function () {}); else lock();
  });
  var peekTimer = 0;
  function changed() {
    document.body.classList.toggle('full', isFull());
    document.body.classList.remove('peek');
    label.textContent = isFull() ? 'Exit fullscreen' : 'Fullscreen';
    setTimeout(fit, 50);
  }
  document.addEventListener('fullscreenchange', changed);
  document.addEventListener('webkitfullscreenchange', changed);
  // In fullscreen the bar hides; the small G shows it for a few seconds.
  pill.addEventListener('click', function () {
    document.body.classList.add('peek');
    clearTimeout(peekTimer);
    peekTimer = setTimeout(function () { document.body.classList.remove('peek'); }, 4000);
  });
})();
</script>
</body>
</html>
